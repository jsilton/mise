# Free-plan Worker for Mise's agent search. Cloudflare Workers Builds runs
# `pnpm run agent-search:worker` to write index.json, then deploys with this file.
# The routes answer on jordansilton.com, whose zone is on Cloudflare in front of GitHub Pages,
# so only the search paths reach the Worker and every other page still comes from Pages.
name = "mise-agent-search"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "jordansilton.com/.well-known/search", zone_name = "jordansilton.com" },
  { pattern = "jordansilton.com/.well-known/search/", zone_name = "jordansilton.com" },
  { pattern = "jordansilton.com/mise/.well-known/search", zone_name = "jordansilton.com" },
  { pattern = "jordansilton.com/mise/.well-known/search/", zone_name = "jordansilton.com" },
]
